{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile | MotoServe</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Edit My Profile</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <br>
    <a href="{% url 'profile' %}">Cancel</a>
</body>
</html>
