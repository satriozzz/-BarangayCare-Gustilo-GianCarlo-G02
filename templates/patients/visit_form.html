
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | BarangayCare</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <h1>{{ title }}</h1>

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
            <br>
        {% endfor %}

        <button type="submit">Save Visit</button>
        <a href="{% url 'visit_list' %}">Cancel</a>
    </form>

</body>
</html>
